<!doctype html>  
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fichajes.PRO.Alexander v1.6</title>  
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>  
<style>:root{--n:#17365d;--b:#2f75b5;--g:#238636;--r:#c62828;--a:#9a6700;--l:#dce3ec}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:14px/1.45 system-ui,Segoe UI,sans-serif}header{padding:25px 5vw;background:linear-gradient(135deg,var(--n),#28588c);color:#fff}header h1{margin:0}main{max-width:1220px;margin:auto;padding:24px}.panel,.card,details{background:#fff;border:1px solid var(--l);border-radius:14px;box-shadow:0 5px 18px #19375d12}.panel{padding:18px}.upload,.settings,.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.drop{flex:1;min-width:280px;padding:18px;text-align:center;border:2px dashed #91acd0;border-radius:11px}.drop.drag{background:#eaf4ff}button,.filebtn{padding:11px 16px;border:0;border-radius:9px;background:var(--b);color:#fff;font-weight:700;cursor:pointer}.filebtn input{display:none}.secondary{background:#eef4fb;color:var(--n);border:1px solid #b9cbe3}.settings{margin-top:14px}.settings input{width:72px;padding:8px}.status{margin-top:12px;font-weight:650}.ok,.positive{color:var(--g)}.bad,.negative{color:var(--r)}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}.card{padding:14px}.card small{color:#607089}.card strong{display:block;font-size:21px}.toolbar{justify-content:space-between;margin:18px 0}.toolbar input{padding:10px;border:1px solid #bbc7d6;border-radius:8px}details{margin:12px 0;overflow:hidden}summary{display:grid;grid-template-columns:145px repeat(4,1fr) 130px;gap:12px;align-items:center;padding:15px 18px;cursor:pointer;list-style:none}.date{font-size:16px;font-weight:800;color:#135c9e;text-decoration:underline}.pill{padding:5px 9px;border-radius:999px;text-align:center;font-weight:750}.good{background:#e6f4ea;color:#26733a}.inc{background:#fde7e7;color:#a61b1b}.pending{background:#fff3cd;color:#745400}.body{padding:0 18px 18px;border-top:1px solid var(--l);display:grid;grid-template-columns:1.1fr .9fr;gap:18px}h3{color:var(--n)}table{width:100%;border-collapse:collapse}th{background:var(--b);color:#fff;text-align:left}th,td{padding:9px;border:1px solid var(--l)}tfoot td{font-weight:800;background:#eef4fb}.alert{margin-top:10px;padding:10px;background:#fff0f0;border-left:4px solid var(--r);color:#8b1717}.hidden{display:none!important}.empty{text-align:center;padding:45px;color:#67758a}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}summary{grid-template-columns:1fr 1fr}.body{grid-template-columns:1fr}}@media print{.panel,.toolbar{display:none}}.week{margin:16px 0;border:1px solid #bfd0e6;background:#fff}.week>summary{grid-template-columns:minmax(180px,1.2fr) repeat(3,1fr) 140px;background:linear-gradient(90deg,#eaf2fb,#f8fbff);border-left:6px solid var(--b);padding:17px 20px}.week>summary:hover{background:#e3eefb}.week-title{font-size:18px;font-weight:850;color:var(--n);text-transform:none}.week-content{padding:8px 14px 14px;background:#f7f9fc}.week .day{margin:10px 0;box-shadow:none;border-color:#d7e0eb}.week .day>summary{background:#fff}.week[open]>summary{border-bottom:1px solid #bfd0e6}.week-arrow{font-size:18px;color:var(--b);font-weight:900}.week[open] .week-arrow{transform:rotate(90deg)}@media(max-width:900px){.week>summary{grid-template-columns:1fr 1fr}.week-content{padding:6px}}</style></head>  
<body><header><h1>fichajes.PRO.Alexander <small>v1.6</small></h1><div>Análisis literal de entradas, salidas y balance semanal</div></header><main><section class="panel"><div class="upload"><div id="drop" class="drop"><b>Arrastra aquí el Excel</b><br>o selecciónalo</div><label class="filebtn">Seleccionar Excel<input id="file" type="file" accept=".xlsx,.xls"></label></div><div class="settings"><label>Jornada objetivo <input id="hours" type="number" value="7" min="0" max="23"> h <input id="minutes" type="number" value="38" min="0" max="59"> min</label><button id="recalc">Recalcular</button><button id="print" class="secondary">Imprimir / PDF</button></div><div id="status" class="status">Carga el Excel de marcajes.</div></section><section id="dashboard" class="hidden"><div id="cards" class="cards"></div><div class="toolbar"><b>Detalle por día</b><input id="search" placeholder="Filtrar fecha o estado"></div><div id="days"></div></section><div id="empty" class="empty">Todavía no hay datos cargados.</div></main>  
<script>const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');let raw=[],analysis=[];function fmt(n,sign=false){if(n==null)return'No calculable';let s=n<0?'-':sign&&n>0?'+':'';n=Math.abs(Math.round(n));return`${s}${Math.floor(n/60)} h ${pad(n%60)} min`}  
function dateValue(v){if(typeof v==='number'){let p=XLSX.SSF.parse_date_code(v);return p?new Date(p.y,p.m-1,p.d):null}if(v instanceof Date)return v;let s=String(v||'').trim(),m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);let d=new Date(s);return isNaN(d)?null:d}  
/* CORRECCION v1.6: la hora Excel se mantiene numerica y se redondea al minuto una sola vez. */  
function timeMinutes(v){if(typeof v==='number'){const f=((v%1)+1)%1;return Math.round(f*1440)}if(v instanceof Date){const seconds=v.getHours()*3600+v.getMinutes()*60+v.getSeconds()+v.getMilliseconds()/1000;return Math.round(seconds/60)}const s=String(v||'').trim(),m=s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(!m)return null;return Math.round((Number(m[1])*3600+Number(m[2])*60+Number(m[3]||0))/60)}  
function dk(d){return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function sd(k){let[y,m,d]=k.split('-');return`${d}/${m}/${y}`}function clock(m){m=Math.round(m);return`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`}  
function normalize(rows){return rows.map(r=>{let d=dateValue(r['Fecha marcaje']??r.Fecha),m=timeMinutes(r.Hora);return d&&m!=null?{date:dk(d),mark:String(r['Entrada / Salida']??r['Entrada/Salida']??r['E/S']??'').trim().toUpperCase(),mins:m,status:String(r.Estado??''),type:String(r.Tipo??''),terminal:String(r.Terminal??'')}:null}).filter(Boolean)}  
/* REGLA v1.6: si E y S coinciden en el mismo minuto, S se procesa antes que E. */ 
function analyze(){let target=(+$('#hours').value||0)*60+(+$('#minutes').value||0),g={};raw.forEach(x=>(g[x.date]??=[]).push(x));analysis=Object.entries(g).sort().map(([date,rs])=>{rs.sort((a,b)=>a.mins-b.mins||(a.mark===b.mark?0:(a.mark==='S'?-1:1)));let open=null,last=null,work=0,rest=0,ints=[],inc=[];for(let x of rs){if(x.mark==='E'){if(last){rest+=x.mins-last.mins;last=null}if(open)inc.push(`Entrada ${clock(x.mins)} sin salida para entrada previa ${clock(open.mins)}`);open=x}else if(x.mark==='S'){if(!open)inc.push(`Salida ${clock(x.mins)} sin entrada abierta`);else{let d=x.mins-open.mins;work+=d;ints.push([open.mins,x.mins,d]);open=null;last=x}}else inc.push(`Tipo no reconocido: ${x.mark||'(vacío)'}`)}if(open)inc.push(`Entrada ${clock(open.mins)} sin salida posterior`);let processed=rs.every(x=>x.status.toLowerCase()==='procesado'),valid=!inc.length&&processed,pending=!inc.length&&!processed;return{date,rs,work,rest,ints,inc,valid,pending,balance:valid?work-target:null,target}});render()}  
const MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];function weekInfo(dateKey){const[y,m,d]=dateKey.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,w=Math.floor((d+offset-1)/7)+1;return{key:`${y}-${pad(m)}-W${w}`,label:`W${w}-${MONTHS[m-1]}`}}function weekHtml(items){let groups=[];for(const x of items){let info=weekInfo(x.date),g=groups.find(z=>z.key===info.key);if(!g){g={...info,items:[]};groups.push(g)}g.items.push(x)}return groups.map(g=>{let valid=g.items.filter(x=>x.valid),balance=valid.reduce((s,x)=>s+x.balance,0),inc=g.items.length-valid.length;return`<details class="week" data-filter="${g.label} ${g.items.map(x=>sd(x.date)).join(' ')}"><summary><span class="week-title"><span class="week-arrow">›</span> ${g.label}</span><span><b>Confirmados</b><br>${valid.length}/${g.items.length} días</span><span><b>Balance confirmado</b><br><span class="${balance>=0?'positive':'negative'}">${fmt(balance,true)}</span></span><span><b>Incidencias</b><br>${inc}</span><span class="pill ${inc?'pending':'good'}">${inc?'Revisar':'Completa'}</span></summary><div class="week-content">${g.items.map(day).join('')}</div></details>`}).join('')}function render(){let val=analysis.filter(x=>x.valid),work=val.reduce((s,x)=>s+x.work,0),rest=val.reduce((s,x)=>s+x.rest,0),target=val.reduce((s,x)=>s+x.target,0),bal=work-target;$('#cards').innerHTML=[['Días válidos',val.length],['Trabajo confirmado',fmt(work)],['Objetivo',fmt(target)],['Balance confirmado',fmt(bal,true),bal>=0?'positive':'negative'],['Descansos',fmt(rest)],['Días no calculables',analysis.length-val.length]].map(x=>`<div class="card"><small>${x[0]}</small><strong class="${x[2]||''}">${x[1]}</strong></div>`).join('');$('#days').innerHTML=weekHtml(analysis);$('#dashboard').classList.remove('hidden');$('#empty').classList.add('hidden');filter()}  
function day(x){let state=x.valid?'Correcto':x.pending?'Pendiente':'INCIDENCIA',cls=x.valid?'good':x.pending?'pending':'inc';let ints=x.ints.length?x.ints.map(i=>`<tr><td>${clock(i[0])}</td><td>${clock(i[1])}</td><td>${fmt(i[2])}</td></tr>`).join(''):'<tr><td colspan="3">Sin intervalos cerrados</td></tr>';let marks=x.rs.map(r=>`<tr><td>${clock(r.mins)}</td><td>${r.mark}</td><td>${r.status}</td><td>${r.type}</td><td>${r.terminal}</td></tr>`).join('');return`<details class="day" data-filter="${sd(x.date)} ${state}"><summary><span class="date">${sd(x.date)}</span><span><b>Trabajo</b><br>${x.valid?fmt(x.work):'No calculable'}</span><span><b>Descanso</b><br>${x.valid?fmt(x.rest):'No calculable'}</span><span><b>Balance</b><br><span class="${x.balance>=0?'positive':'negative'}">${x.valid?fmt(x.balance,true):'No calculable'}</span></span><span><b>Marcajes</b><br>${x.rs.length}</span><span class="pill ${cls}">${state}</span></summary><div class="body"><section><h3>Intervalos de trabajo</h3><table><thead><tr><th>Entrada</th><th>Salida</th><th>Tiempo</th></tr></thead><tbody>${ints}</tbody><tfoot><tr><td colspan="2">Balance total del día</td><td>${x.valid?fmt(x.balance,true):'No calculable'}</td></tr><tr><td colspan="2">Tiempo total de descanso</td><td>${x.valid?fmt(x.rest):'No calculable'}</td></tr></tfoot></table>${x.inc.length?`<div class="alert"><b>Incidencia:</b> ${x.inc.join('; ')}</div>`:''}</section><section><h3>Fichajes originales</h3><table><thead><tr><th>Hora</th><th>E/S</th><th>Estado</th><th>Tipo</th><th>Terminal</th></tr></thead><tbody>${marks}</tbody></table></section></div></details>`}  
function filter(){let q=$('#search').value.toLowerCase();document.querySelectorAll('.day').forEach(d=>d.classList.toggle('hidden',q&&!d.dataset.filter.toLowerCase().includes(q)));document.querySelectorAll('.week').forEach(w=>{let own=w.dataset.filter.toLowerCase().includes(q),visible=[...w.querySelectorAll('.day')].some(d=>!d.classList.contains('hidden'));w.classList.toggle('hidden',q&&!own&&!visible);if(q&&(own||visible))w.open=true})}async function load(file){try{$ ('#status').textContent='Leyendo '+file.name+'…';let data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array',cellDates:false,raw:true}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{range:1,defval:'',raw:true});raw=normalize(rows);if(!raw.length)throw Error('No se encontraron marcajes reconocibles.');analyze();$('#status').className='status ok';$('#status').textContent=`${file.name}: ${raw.length} marcajes cargados.`}catch(e){$('#status').className='status bad';$('#status').textContent='Error: '+e.message}}  
$('#file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);$('#recalc').onclick=()=>raw.length&&analyze();$('#print').onclick=()=>print();$('#search').oninput=filter;const drop=$('#drop');['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>e.dataTransfer.files[0]&&load(e.dataTransfer.files[0]));</script></body></html>
